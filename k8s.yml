apiVersion: v1
kind: Secret
metadata:
  name: confluence-agent-secret
type: Opaque
stringData:
  litellm-api-key: "your-litellm-api-key-here"
  openai-api-key: "your-openai-api-key-here"
  aws-access-key: "your-aws-access-key-here"
  aws-secret-key: "your-aws-secret-key-here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confluence-agent
  labels:
    app: confluence-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: confluence-agent
  template:
    metadata:
      labels:
        app: confluence-agent
    spec:
      containers:
      - name: confluence-agent
        image: confluence-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        # Confluence MCP配置
        - name: LITELLM_BASE_URL
          value: "http://litellm-proxy:4000"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: confluence-agent-secret
              key: litellm-api-key
        - name: CONFLUENCE_MODEL
          value: "confluence-mcp"
        
        # LLM配置
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: confluence-agent-secret
              key: openai-api-key
        - name: OPENAI_API_BASE
          value: "https://api.openai.com/v1"
        - name: LLM_MODEL
          value: "gpt-4"
        
        # AWS S3配置
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: confluence-agent-secret
              key: aws-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: confluence-agent-secret
              key: aws-secret-key
        - name: AWS_REGION
          value: "us-east-1"
        - name: S3_BUCKET
          value: "confluence-docs-backup"
        
        # Agent配置
        - name: SEARCH_LIMIT
          value: "10"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: confluence-agent
  labels:
    app: confluence-agent
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: confluence-agent

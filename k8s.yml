apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-mcp
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: your-org/doc-mcp:latest
          ports:
            - containerPort: 8000
          env:
            - name: CONFLUENCE_MCP_URL
              value: http://confluence-mcp:8080/sse
